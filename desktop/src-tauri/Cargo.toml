[package]
name = "audio-translator-desktop"
version = "0.1.0"
edition = "2021"

[lib]
name = "audio_translator_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
audio-translator = { path = "../../backend" }
